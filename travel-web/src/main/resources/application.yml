server:
  port: 8080

spring:
  # 本地开发会自动加载 application-local.yaml（已被 .gitignore 忽略，里面放真实 key）
  # 生产环境应当通过 ENV 变量或 secret 管理工具注入
  config:
    import:
      - optional:classpath:application-local.yaml
      - optional:file:.env[.properties]
  application:
    name: travel-agent-web

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  datasource:
    url: ${TRAVEL_DB_URL:jdbc:mysql://localhost:3306/travel_agent?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${TRAVEL_DB_USERNAME:epiphany}
    password: ${TRAVEL_DB_PASSWORD:123456}

  # QQ 邮箱 SMTP 配置 - 可发送至任何邮箱
  mail:
    host: ${QQ_MAIL_HOST:smtp.qq.com}
    port: ${QQ_MAIL_PORT:465}
    username: ${QQ_MAIL_USERNAME:}
    password: ${QQ_MAIL_AUTH_CODE:}
    protocol: smtp
    default-encoding: UTF-8
    # 关键配置：允许发件人地址与 username 不一致，支持发送到任意邮箱
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: false
      mail.smtp.ssl.enable: true
      mail.smtp.ssl.trust: smtp.qq.com
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
      mail.smtp.from: ${QQ_MAIL_USERNAME:}
      mail.mime.charset: UTF-8
      mail.smtp.allow8bitmime: true

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  sql:
    init:
      mode: never

  # Spring AI 配置 (智谱GLM-4-Flash) - API Key 从 application-local.yaml 或 ENV 注入
  ai:
    # 关闭自动重试；行程结构化修复由 HostAgentService 按校验结果显式控制。
    retry:
      max-attempts: 1
    openai:
      api-key: ${ZHIPU_API_KEY:}
      base-url: https://open.bigmodel.cn/api/paas/v4
      chat:
        options:
          model: glm-4-flash
          temperature: 0.7

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO
      table-underline: true
  mapper-locations: classpath*:/mapper/**/*.xml

  # 旅行规划 Agent 配置
travel:
  # MCP Server 配置
  mcp:
    weather-url: ${WEATHER_MCP_URL:http://localhost:8081}
    poi-url: ${POI_MCP_URL:http://localhost:8082}
    meal-url: ${MEAL_MCP_URL:http://localhost:8083}
    budget-url: ${BUDGET_MCP_URL:http://localhost:8084}
    itinerary-url: ${ITINERARY_MCP_URL:http://localhost:8085}
    connect-timeout: ${MCP_CONNECT_TIMEOUT:3s}
    response-timeout: ${MCP_RESPONSE_TIMEOUT:8s}
    request-timeout: ${MCP_REQUEST_TIMEOUT:9s}
    server-info-timeout: ${MCP_SERVER_INFO_TIMEOUT:3s}
  # 熔断器配置
  ratelimit:
    enabled: true
    weather:
      limit: 800
    amap:
      limit: 4700
  # 天气 API / 翻译配置 - API Key 从 application-local.yaml 或 ENV 注入
  weather:
    api-key: ${WEATHER_API_KEY:}
    enabled: true
    translate:
      # 智谱实时翻译开关。当前智谱 endpoint 在项目里 404，关闭以避免无谓重试；调试好智谱后改成 true
      use-llm: false
  # 高德地图 API 配置 - API Key 从 application-local.yaml 或 ENV 注入
  amap:
    api-key: ${GAODE_API_KEY:}
    enabled: true

# 和风天气 API 配置（兼容旧配置）- API Key 从 application-local.yaml 或 ENV 注入
qweather:
  api-key: ${WEATHER_API_KEY:}
  enabled: true
  daily-limit: 800

# 高德地图 API 配置（兼容旧配置）- API Key 从 application-local.yaml 或 ENV 注入
gaode:
  api-key: ${GAODE_API_KEY:}
  enabled: true
  daily-limit: 4700

# A2A 编排分层超时
a2a:
  runtime:
    tool-timeout: ${A2A_TOOL_TIMEOUT:10s}
    aggregate-timeout: ${A2A_AGGREGATE_TIMEOUT:30s}
    sse-timeout: ${A2A_SSE_TIMEOUT:5m}

# 日志
logging:
  level:
    com.travel: INFO
    # 开启邮件发送调试日志，排查问题时使用
    org.springframework.mail: DEBUG
