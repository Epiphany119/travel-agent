# A2A Runtime Configuration

server:
  port: 8086

spring:
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:your-api-key-here}
      model: gpt-4o-mini
      base-url: https://api.openai.com/v1

# MCP Server URLs and HTTP timeouts (from travel-mcp-client)
travel:
  mcp:
    weather-url: ${WEATHER_MCP_URL:http://localhost:8081}
    poi-url: ${POI_MCP_URL:http://localhost:8082}
    meal-url: ${MEAL_MCP_URL:http://localhost:8083}
    budget-url: ${BUDGET_MCP_URL:http://localhost:8084}
    itinerary-url: ${ITINERARY_MCP_URL:http://localhost:8085}
    connect-timeout: ${MCP_CONNECT_TIMEOUT:3s}
    response-timeout: ${MCP_RESPONSE_TIMEOUT:8s}
    request-timeout: ${MCP_REQUEST_TIMEOUT:8s}
    server-info-timeout: ${MCP_SERVER_INFO_TIMEOUT:3s}

# A2A Runtime specific settings
a2a:
  runtime:
    tool-timeout: ${A2A_TOOL_TIMEOUT:10s}
    aggregate-timeout: ${A2A_AGGREGATE_TIMEOUT:30s}
    sse-timeout: ${A2A_SSE_TIMEOUT:5m}
